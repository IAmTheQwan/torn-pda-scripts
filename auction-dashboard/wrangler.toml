name = "caf-auction-dev"
main = "src/worker.js"
compatibility_date = "2026-10-22"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
ENVIRONMENT = "development"
REQUIRE_ACCESS = "true"
SYNC_PAGES_PER_RUN = "5"
TORN_API_BASE_URL = "https://api.torn.com/v2"
CF_ACCESS_TEAM_DOMAIN = "https://small-wave-b24c.cloudflareaccess.com"
CF_ACCESS_AUD = "dddf25be5fb3978715e8759108da2e3fbca41103f0c1706ba461e3fe4ca3d09e"

[[d1_databases]]
binding = "DB"
database_name = "caf-auction-dev"
database_id = "a76f60dd-586f-48a4-86eb-2a054b2b9a82"
migrations_dir = "migrations"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
